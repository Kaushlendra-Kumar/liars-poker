# Reverse proxy for the Liar's Poker stack.
#
# Three jobs: terminate TLS, upgrade /ws to a WebSocket, and route everything
# else to the Next.js client. It makes no gameplay decision and inspects no
# message.

worker_processes auto;

events {
  worker_connections 8192;   # each player holds one long-lived connection
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Log the upgrade and the duration, which is what you want when debugging a
  # dropped game. Never log request bodies: a claim is harmless but a frame
  # is still client data, and the rejoin token travels in one.
  log_format game '$remote_addr "$request" $status '
                  'upgrade="$http_upgrade" dur=$request_time '
                  'sent=$body_bytes_sent';
  access_log /dev/stdout game;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nodelay   on;
  server_tokens off;

  # The WebSocket upgrade hop-by-hop header. When the client does not send
  # Upgrade, this resolves to "close" so ordinary requests are unaffected.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream game_server { server server:8080; keepalive 32; }
  upstream web_client   { server web:3000;   keepalive 32; }

  # Plain HTTP exists only to redirect. The rejoin token is a bearer
  # credential, so the socket must never be unencrypted.
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The game socket.
    location /ws {
      proxy_pass http://game_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # The server checks Origin itself, so it must arrive intact.
      proxy_set_header Host       $host;
      proxy_set_header Origin     $http_origin;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # A player can legitimately sit silent for a whole turn, and the
      # server's own heartbeat is every 15s with a 45s tolerance. These
      # timeouts must exceed that or the proxy will cut healthy games; the
      # server, not nginx, decides when a player has gone.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_connect_timeout 10s;

      # Buffering a stream would add latency and defeat the point.
      proxy_buffering off;
    }

    # Room creation and lookup.
    location /rooms {
      proxy_pass http://game_server;
      proxy_http_version 1.1;
      proxy_set_header Host   $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      limit_except GET POST { deny all; }
    }

    # Probes are for the orchestrator, not the internet.
    location = /healthz {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny  all;
      proxy_pass http://game_server;
    }
    location = /readyz {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny  all;
      proxy_pass http://game_server;
    }

    # Everything else is the client.
    location / {
      proxy_pass http://web_client;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
