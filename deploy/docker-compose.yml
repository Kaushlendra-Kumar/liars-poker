# Single-host production-shaped stack: one reverse proxy terminating TLS in
# front of the game server and the client.
#
# Rooms are in memory and a player's session is pinned to the instance that
# holds their room, so the game server is deliberately a single replica here.
# Scaling out needs room-aware routing, which DEPLOYMENT.md describes rather
# than pretends to solve.

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      LP_ADDR: ":8080"
      LP_ORIGINS: ${PUBLIC_ORIGIN}
      LP_LOG_LEVEL: ${LOG_LEVEL:-info}
      LP_TURN_DURATION: ${TURN_DURATION:-30s}
      LP_REVEAL_DURATION: ${REVEAL_DURATION:-6s}
      LP_LOG_FORMAT: json
      LP_MAX_ROOMS: ${MAX_ROOMS:-512}
      LP_MAX_CONNS_PER_ROOM: ${MAX_CONNS_PER_ROOM:-32}
      LP_MAX_CONNS_PER_PLAYER: ${MAX_CONNS_PER_PLAYER:-4}
      LP_MAX_HANDSHAKES: ${MAX_HANDSHAKES:-256}
      LP_IDLE_TIMEOUT: ${IDLE_TIMEOUT:-30m}
      LP_SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-15s}
    expose:
      - "8080"
    healthcheck:
      # The image has no shell, so the check runs from the compose host's
      # perspective via the proxy instead. Kept here as documentation of the
      # intended probe; orchestrators should use an HTTP probe on /readyz.
      disable: true
    # A room actor is cheap; the cap on rooms is what bounds memory.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_SERVER_HTTP: ${PUBLIC_ORIGIN}
        NEXT_PUBLIC_SERVER_WS: ${PUBLIC_WS_ORIGIN}
    restart: unless-stopped
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
    security_opt:
      - no-new-privileges:true
